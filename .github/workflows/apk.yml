# Baut die Android-APK auf den Rechnern von GitHub – ohne Expo-Konto und ohne
# lokales Android Studio. Start: Reiter "Actions" → "Android-APK bauen" → "Run workflow".
# Die fertige APK liegt danach unter "Artifacts" des Laufs.
#
# Secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_MAPS_API_KEY                                  → ohne ihn bleibt die Karte leer
# Optional:
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY → anderes Supabase-Projekt
#   EAS_PROJECT_ID + GOOGLE_SERVICES_JSON_BASE64        → Push-Benachrichtigungen
#   EXPO_PUBLIC_LEGAL_NAME / _ADDRESS / _EMAIL / _HOSTING_REGION → Betreiberangaben
#   APP_IDENTIFIER                                       → eigene App-Kennung
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#                                                        → eigener Signaturschlüssel
name: Android-APK bauen

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Öffentliche Werte des Supabase-Projekts "dayhop" (stecken ohnehin in jeder App). Secrets gleichen Namens haben Vorrang.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://fbjekdcvzfefwwnjlyrh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_oNs39mriXVQiLInCdfsTqw_LLlA7HB1' }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
      EXPO_PUBLIC_LEGAL_NAME: ${{ secrets.EXPO_PUBLIC_LEGAL_NAME }}
      EXPO_PUBLIC_LEGAL_ADDRESS: ${{ secrets.EXPO_PUBLIC_LEGAL_ADDRESS }}
      EXPO_PUBLIC_LEGAL_EMAIL: ${{ secrets.EXPO_PUBLIC_LEGAL_EMAIL }}
      EXPO_PUBLIC_LEGAL_HOSTING_REGION: ${{ secrets.EXPO_PUBLIC_LEGAL_HOSTING_REGION || 'EU (Frankfurt)' }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Schlüssel vorhanden?
        run: |
          fehlt=""
          [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] && fehlt="$fehlt EXPO_PUBLIC_SUPABASE_URL"
          [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ] && fehlt="$fehlt EXPO_PUBLIC_SUPABASE_ANON_KEY"
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::warning::GOOGLE_MAPS_API_KEY fehlt: Die APK wird gebaut, aber die Karte bleibt leer, bis das Secret gesetzt und neu gebaut ist."
          fi
          if [ -n "$fehlt" ]; then
            echo "::error::Diese Secrets fehlen:$fehlt (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pakete installieren
        run: npm ci

      - name: Prüfen (Typen, Geldlogik, Datenbank)
        run: npm run typecheck && npm test && npm run test:db

      - name: Firebase-Datei für Push (optional)
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          echo "GOOGLE_SERVICES_JSON=./google-services.json" >> "$GITHUB_ENV"

      - name: Android-Projekt erzeugen
        run: npx expo prebuild --platform android --no-install

      - name: APK bauen
        working-directory: android
        run: |
          sign=""
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dayhop.keystore"
            sign="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/dayhop.keystore -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::Kein eigener Signaturschlüssel hinterlegt. Die APK wird mit dem öffentlichen Test-Schlüssel signiert: zum Ausprobieren in Ordnung, vor der Weitergabe an die Gruppe bitte ANDROID_KEYSTORE_* setzen (siehe README)."
          fi
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 $sign

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: DayHop-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Startet die APK auf mehreren Android-Versionen und schreibt Absturzmeldungen ins Protokoll.
  starttest:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34, 35, 36]
        de: ['', '1']
    env:
      APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
      SMOKE_DE: ${{ matrix.de }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DayHop-APK
          path: android/app/build/outputs/apk/release
      - name: KVM für den Emulator aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Starttest Android-API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none ${{ matrix.de == '1' && '-change-locale de-DE -timezone Europe/Berlin' || '' }}
          disable-animations: true
          script: ./scripts/smoke-test.sh
