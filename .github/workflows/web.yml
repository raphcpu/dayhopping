# Browser-Version (PWA für iPhone & Co.) bauen und auf GitHub Pages veröffentlichen:
#   https://raphcpu.github.io/dayhopping/
#
# Optionale Secrets/Variablen:
#   GOOGLE_MAPS_WEB_KEY → Browser-Schlüssel (Maps JavaScript API, Website-Einschränkung raphcpu.github.io/*)
#   GOOGLE_MAPS_MAP_ID  → Karten-ID (sonst Googles Demo-ID)
name: Web (PWA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_BASE_URL: /dayhopping
      EXPO_PUBLIC_BASE_PATH: /dayhopping/
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://fbjekdcvzfefwwnjlyrh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_oNs39mriXVQiLInCdfsTqw_LLlA7HB1' }}
      EXPO_PUBLIC_GOOGLE_MAPS_WEB_KEY: ${{ secrets.GOOGLE_MAPS_WEB_KEY || vars.GOOGLE_MAPS_WEB_KEY || 'AIzaSyCOhKVHHy_422qatYmWU4jLpyBnsv6Tsy4' }}
      EXPO_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ secrets.GOOGLE_MAPS_MAP_ID || vars.GOOGLE_MAPS_MAP_ID }}
      EXPO_PUBLIC_VAPID_PUBLIC_KEY: BHNrcIrU3tAewlHVy0av1Z9oIsnD8rnvy7ik-LncpqrLc-OmJNea-qMBLor-WbqroSlLaI7MTW9VLczIZFyP_ZE
      EXPO_PUBLIC_LEGAL_NAME: ${{ secrets.EXPO_PUBLIC_LEGAL_NAME }}
      EXPO_PUBLIC_LEGAL_ADDRESS: ${{ secrets.EXPO_PUBLIC_LEGAL_ADDRESS }}
      EXPO_PUBLIC_LEGAL_EMAIL: ${{ secrets.EXPO_PUBLIC_LEGAL_EMAIL }}
      EXPO_PUBLIC_LEGAL_HOSTING_REGION: ${{ secrets.EXPO_PUBLIC_LEGAL_HOSTING_REGION || 'EU (Frankfurt)' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web-Version bauen
        run: npm run web:build
      - name: Im iPhone-Browser testen
        run: |
          npm install --no-save playwright@1 http-server@14 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p site && cp -r dist site/dayhopping
          npx http-server site -p 8080 -s --proxy http://localhost:8080/dayhopping/? &
          sleep 3
          node scripts/web-smoke.cjs http://localhost:8080/dayhopping/
          for f in web-*.png; do echo "BILD $f"; base64 -w0 "$f"; echo; done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
